name: Bug report
description: Report reproducible CPUAlert behavior that is not security-sensitive.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, Team IDs, private process names, or unredacted traces. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: CPUAlert version or commit
      placeholder: 0.1.2 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac model/chip, and Xcode version if this is a build problem.
      placeholder: macOS 15.x, Apple M-series, Xcode 16.x
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CPU monitoring
        - GPU monitoring
        - Alerts and notifications
        - Settings and login item
        - Process termination or helper
        - User interface and accessibility
        - Build, tests, or packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I removed private process names, usernames, signing identities, Team IDs, tokens, and sensitive trace data.
          required: true
        - label: This report is not a security vulnerability.
          required: true
