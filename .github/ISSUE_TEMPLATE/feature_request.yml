name: Feature request
description: Propose a focused improvement to CPUAlert.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy, security, and metric impact
      description: Note any networking, retained data, permissions, privileged actions, or changes to metric semantics.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds did you consider?
    validations:
      required: false
